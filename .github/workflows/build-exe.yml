.github/workflows/build-exe.yml

GitHub Actions クラウド上で Windows 専用ポータブル .exe を自動生成する設定

name: Build Windows Portable App

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: windows-latest

steps:
  - name: リポジトリのソースコードを取得
    uses: actions/checkout@v4

  - name: Node.js 環境をセットアップ
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: 'npm'

  - name: 依存パッケージのインストール
    run: npm install

  - name: Windows ポータブル .exe の自動ビルド
    run: npm run build:win

  - name: 生成された .exe ファイルを Artifacts (ダウンロード用) として保存
    uses: actions/upload-artifact@v4
    with:
      name: reha-work-manager-windows-exe
      path: dist/*.exe
      if-no-files-found: error
